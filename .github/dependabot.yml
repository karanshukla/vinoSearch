# Nothing auto-merges. The 7-day cooldown keeps a freshly compromised release
# out of a PR until the ecosystem has had time to notice. Security updates
# bypass the cooldown.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  # Actions stay pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
