# Nothing auto-merges. The 7-day cooldown keeps a freshly compromised release
# out of a PR until the ecosystem has had time to notice. Security updates
# bypass the cooldown.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      # Our own crate, released from karanshukla/vinoUserInterface.
      exclude: ["vino-user-interface"]
    # A dependency takes the first group it matches: the vino theme gets a PR
    # of its own on the next Monday run, with no week's wait.
    groups:
      vino-user-interface:
        patterns: ["vino-user-interface"]
      cargo:
        patterns: ["*"]

  # Actions stay pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
