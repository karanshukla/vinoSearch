name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes its running checks; main's runs all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No NPU, model or OpenVINO needed: `openvino` uses runtime-linking, so
  # nothing links OpenVINO at build time, and the tests use tiny fixtures.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Line coverage of the workspace's tests, as lcov (artifact) and a summary
  # table on the run page. The floor sits a few points under what CI
  # measured when it was set (66.2% of lines); raise it as tests land.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --no-report
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Summary
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
      - run: cargo llvm-cov report --summary-only --fail-under-lines 63

  # The oldest Rust install.sh accepts: 1.89 for vinosearch alone, 1.95 with
  # the settings window (egui). Matches rust-version in the Cargo.tomls.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.89"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.89 check --locked -p vinosearch -p vinosearch-shared --all-targets
      - run: cargo +1.95 check --locked --workspace --all-targets

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Preinstalled on the runner. Info-level notes (SC1091, SC2018/2019) are
      # left alone.
      - run: shellcheck -S warning scripts/*.sh

  # Ranking evals (#107): the testbed indexed on the CPU, every query in
  # evals/queries.toml run, failing under its thresholds. Image queries are
  # left out: they need the 671 MB vision encoder, and run by hand.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pins
        id: pins
        run: |
          pin() { sed -n "s/.*const $1: &str = \"\([0-9a-f]*\)\";/\1/p" src/model.rs; }
          echo "text=$(pin REVISION)" >> "$GITHUB_OUTPUT"
          echo "ocr=$(pin OCR_REVISION)" >> "$GITHUB_OUTPUT"
          ovfetch=$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "ovfetch") | .version')
          echo "ovfetch=$ovfetch" >> "$GITHUB_OUTPUT"
      # The text model (~300 MB) and OCR (~30 MB), by the Hugging Face commits
      # src/model.rs pins. fetch-model still checks every file's SHA-256 and
      # fetches what's missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/vinosearch/models
          key: models-${{ steps.pins.outputs.text }}-ocr-${{ steps.pins.outputs.ocr }}
      # ovfetch resolves OpenVINO from data compiled into it, so its version
      # (Cargo.lock's, as release.yml ships) pins OpenVINO's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/ovfetch
            ~/.local/lib/vinosearch/openvino
          key: ovfetch-${{ steps.pins.outputs.ovfetch }}
      - run: command -v ovfetch || cargo install --locked ovfetch --version "=${{ steps.pins.outputs.ovfetch }}"
      - run: scripts/install-runtime.sh
      - run: cargo build --locked
      - run: target/debug/vinosearch fetch-model
      - run: scripts/make-testbed.sh "$RUNNER_TEMP/testbed"
      - run: target/debug/vinosearch --device CPU eval "$RUNNER_TEMP/testbed"
