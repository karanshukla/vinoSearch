[package]
name = "vinosearch"
version = "4.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Semantic file search for KDE and GNOME, run on Intel NPUs through OpenVINO"
repository = "https://github.com/karanshukla/vinoSearch"
publish = false

[workspace]
members = [".", "crates/shared", "crates/settings"]

[dependencies]
vinosearch-shared = { path = "crates/shared" }
anyhow = "1.0"
hex = "0.4"
notify = "8"
clap = { version = "4.5", features = ["derive", "env"] }
# dlopen for the NPU prefix's libraries (openvino-sys already pulls it in).
libloading = "0.8"
# Loaded at runtime from ovfetch's prefix, so the build never links against a
# directory that may be replaced and nothing needs an rpath.
openvino = { version = "0.11", features = ["runtime-linking"] }
openvino-sys = { version = "0.11", features = ["runtime-linking"] }
# 0.6.0: `detect` counts an `ovfetch npu install` prefix, whose libraries
# runtime.rs preloads.
ovfetch = { version = "0.6.0", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
ureq = "3"
walkdir = "2.5"
zbus = "5"
toml = "1.1"
futures-channel = "0.3"
libc = "0.2"
# Document text (#55): PDF pages, the XML inside Office/OpenDocument zips, and
# spreadsheets.
lopdf = { version = "0.42", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = "0.37"
unicode-normalization = "0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "pnm"] }
rbook = { version = "0.7", default-features = false }
cfb = "0.15"
encoding_rs = "0.8"
codepage = "0.1"

# Core::compile_model_from_file, until intel/openvino-rs#202 is released.
# Pinned by commit; all three come from the same tree because openvino-sys
# declares `links`, so a second copy from crates.io cannot coexist.
[patch.crates-io]
openvino = { git = "https://github.com/karanshukla/openvino-rs", rev = "f72cadbf98921fc463c9ec24cfdc0bdf6611563a" }
openvino-sys = { git = "https://github.com/karanshukla/openvino-rs", rev = "f72cadbf98921fc463c9ec24cfdc0bdf6611563a" }
openvino-finder = { git = "https://github.com/karanshukla/openvino-rs", rev = "f72cadbf98921fc463c9ec24cfdc0bdf6611563a" }
