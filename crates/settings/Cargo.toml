[package]
name = "vinosearch-settings"
version = "4.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Settings window for vinoSearch"
repository = "https://github.com/karanshukla/vinoSearch"
publish = false

# Talks to the runner over D-Bus and edits config.toml; never loads OpenVINO.
[dependencies]
vinosearch-shared = { path = "../shared" }
anyhow = "1.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland"] }
vino-ui = { package = "vino-user-interface", version = "0.2.1" }
serde_json = "1.0"
zbus = "6"
serde = "1.0"
futures-lite = "2"
# Thumbnails for the search window's photo grid (#111), with the formats the
# indexer reads.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "pnm"] }
# The freedesktop thumbnail cache names files by the MD5 of their URI.
md-5 = "0.11"


[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false }
