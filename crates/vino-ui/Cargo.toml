[package]
name = "vino-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "The egui theme and widgets shared by vinoSearch, vinoWhisper and vinoSpeak"
repository = "https://github.com/karanshukla/vinoSearch"
publish = false

# Only egui: the apps bring eframe. default_fonts stays on for the glyphs the
# bundled Latin subsets lack.
[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false }
