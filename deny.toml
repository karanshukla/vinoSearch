[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
# zbus 5.x still depends on the standalone crates; no upgrade path until zbus 6
# is adopted by our dependency chain.
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # paste is unmaintained but only pulled in transitively by tokenizers;
    # no safe upgrade is available.
    "RUSTSEC-2024-0436",
    # ttf-parser is unmaintained; lopdf uses it only to embed fonts when
    # writing a PDF, which reading text never does. No safe upgrade is available.
    "RUSTSEC-2026-0192",
    # Bundled SQLCipher is vulnerable to a crafted database and WAL with
    # different page sizes. The index directory is private, but imported or
    # tampered indexes remain a risk. Even rusqlite 0.41 bundles an affected
    # SQLCipher; remove this when a patched release is available:
    # https://github.com/rusqlite/rusqlite/pull/1932
    "RUSTSEC-2026-0459",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0", "Zlib", "BSL-1.0", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# crates/shared is a path dependency inside this workspace, never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The openvino-rs fork pinned in Cargo.toml's [patch.crates-io], until
# intel/openvino-rs#202 is released.
allow-git = [
    "https://github.com/karanshukla/openvino-rs",
]
