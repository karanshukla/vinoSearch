# Ranking evals (#107) over the testbed scripts/make-testbed.sh writes:
#
#   scripts/make-testbed.sh /tmp/testbed
#   vinosearch --device CPU eval /tmp/testbed
#
# Each [[query]] lists the files (relative to the testbed) that count as
# found; `at` is the line, or the page or slide, their best chunk should
# cover. `kind` groups the per-kind numbers:
#
#   keyword         shares the file's words
#   paraphrase      says the same thing in other words
#   section         the right part of a longer file
#   identifier      a name from code, a SKU, a config variable
#   cross-language  an English query for a French or Hindi file
#   document        text inside a PDF, Office file, RTF, .doc or CSV
#   image           a picture by what's in it; needs --images, so not in CI
#
# Queries for code start with `code:`, as they must since code became a kind
# of its own (#110); eval turns code on, as it does documents.
#
# A run fails when an overall metric (image queries left out unless
# --images) is below its threshold; the --min-* flags override them. The CPU
# baseline, 55 queries on 2026-10-25, was recall@1 0.909, recall@5 0.964,
# MRR 0.936. Each threshold leaves room for two queries to drop out of first
# place (about 0.018 each), since a few sit within 0.01 of a rival file or
# of the floor and the NPU's vectors differ from the CPU's by about that.
# Raise them when a change lifts the baseline.

[thresholds]
recall_at_1 = 0.87
recall_at_5 = 0.92
mrr = 0.90

